[project]
name = "datasette-scribe"
version = "0.2a2"
description = "Transcribe audio in Datasette"
requires-python = ">=3.10"
authors = [{ name = "Alex Garcia" }]
license = "Apache-2.0"
classifiers = [
    "Framework :: Datasette",
]

dependencies = [
    "datasette>=1a23",
    "datasette-plugin-router>=0.0.1a2",
    "datasette-vite>=0.0.1a4",
    # Hard dep (following datasette-paper): with user-profiles installed,
    # acl-share's share_capabilities() reports people=true, so the share
    # dialog's People section (search + avatars) is always available.
    "datasette-user-profiles>=0.1.0a8",
]


[project.urls]
Homepage = "https://github.com/datasette/datasette-scribe"
Changelog = "https://github.com/datasette/datasette-scribe/releases"
Issues = "https://github.com/datasette/datasette-scribe/issues"
CI = "https://github.com/datasette/datasette-scribe/actions"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[dependency-groups]
# datasette-acl (sharing-v2) backs per-transcription sharing and
# datasette-acl-share ships the <datasette-acl-share-dialog> bundle. Both are
# soft dependencies: scribe imports them defensively (see permissions.py) and
# falls back to the global datasette_scribe_scribe permission when they are
# absent. (datasette-user-profiles, by contrast, is a hard runtime dep — see
# [project].dependencies above.) All three are unpublished sibling checkouts,
# referenced as editable path sources below for local dev + tests.
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.0",
    "datasette-acl",
    "datasette-acl-share",
]
yt = ["yt-dlp"]

[tool.uv.sources]
datasette-acl = { path = "../datasette-acl", editable = true }
datasette-acl-share = { path = "../datasette-acl-share", editable = true }
datasette-user-profiles = { path = "../datasette-user-profiles", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
datasette-scribe = "datasette_scribe.cli:scribe_cli"

[project.entry-points.datasette]
scribe = "datasette_scribe"

[tool.setuptools.package-data]
datasette_scribe = ["static/**/*", "templates/*", "manifest.json", "*.sql"]

[tool.setuptools.packages.find]
exclude = [
    "frontend",
]
